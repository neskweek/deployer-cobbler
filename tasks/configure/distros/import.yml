---
# Import distros

- block:
    - name: Setup fact with distros ISO artifacts
      set_fact:
        cobbler_distros_artifacts: >-
          {{ lookup("template", "artifacts.yml.j2") | from_yaml }}

    - name: Download distros ISO artifacts
      include_role:
        name: amtega.artifact
      vars:
        artifact_list: "{{ cobbler_distros_artifacts }}"

    - name: Create temporary mount directories for ISO files
      file:
        path: "{{ cobbler_iso_mount_dir }}/{{ cobbler_distro.artifact.file }}"
        state: directory
        owner: root
        group: root
        mode: 0755
      register: cobbler_create_mount_dirs_result
      loop: "{{ _cobbler_updated_distros.values() | list }}"
      loop_control:
        loop_var: cobbler_distro
        label: "{{ cobbler_distro.name }}"

    - name: Mount ISO files in temporary directories
      mount:
        fstype: iso9660
        opts: "loop,ro"
        src: >-
          {{ [ cobbler_iso_dir,
               cobbler_distro.artifact.dest | default(""),
               cobbler_distro.artifact.file ] | join("/") }}
        path: "{{ cobbler_iso_mount_dir }}/{{ cobbler_distro.artifact.file }}"
        state: mounted
      register: cobbler_mount_isos_result
      loop: "{{ _cobbler_updated_distros.values() | list }}"
      loop_control:
        loop_var: cobbler_distro
        label: "{{ cobbler_distro.name }}"

    - name: Trigger cobbler signature update
      command: /bin/true
      when:
        - cobbler_signatures is undefined
        - artifact_result is defined
        - >-
          artifact_result.values()
          | select("changed")
          | list
          | length > 0
      notify:
        - update signature

    - name: Flush handlers
      meta: flush_handlers

    - name: Process ESXi-specific tasks per distro
      include_tasks: esxi.yml
      loop: "{{ _cobbler_updated_distros.values() | list }}"
      loop_control:
        loop_var: cobbler_distro
        label: "{{ cobbler_distro.name }}"
      when: cobbler_distro.name is search("(?i)(esx|vmware)")

    - name: Import distros
      command: >-
        cobbler import
        --name={{ cobbler_distro.name }}
        --path={{ cobbler_iso_mount_dir }}/{{ cobbler_distro.artifact.file }}
        {% if cobbler_distro.arch is defined and cobbler_distro.arch | trim %}
        --arch={{ cobbler_distro.arch }}
        {% endif %}
      register: cobbler_import_result
      loop: "{{ _cobbler_updated_distros.values() | list }}"
      loop_control:
        loop_var: cobbler_distro
        label: "{{ cobbler_distro.name }}"

    - name: Check if grubx64.efi exists in the ISO mount directory
      stat:
        path: "{{ cobbler_iso_mount_dir }}/{{ cobbler_distro.artifact.file }}/EFI/BOOT/grubx64.efi"
      register: grubx64_stat
      loop: "{{ _cobbler_updated_distros.values() | list }}"
      loop_control:
        loop_var: cobbler_distro
        index_var: idx
        label: "{{ cobbler_distro.name }}"

    - name: Set grubx64_source if file found in any distro mount directory
      set_fact:
        grubx64_source: "{{ (grubx64_stat.results | selectattr('stat.exists', 'equalto', True) | list)[0].invocation.module_args.path }}"
      when: (grubx64_stat.results | selectattr('stat.exists', 'equalto', True) | list) | length > 0
      run_once: true

    - name: Copy grubx64.efi to /var/lib/cobbler/grub_config/grub/ if found
      copy:
        src: "{{ grubx64_source }}"
        dest: "/var/lib/cobbler/grub_config/grub/grubx64.efi"
        mode: '0666'
        remote_src: yes
      when: grubx64_source is defined
      run_once: true


    ####
    ### TODO : CAN'T FIND WHERE THIS FILE  GETS CREATED IN THE FIRST PLACE
    ### the if cobbler_distro.name is search("(?i)(esx|vmware)") to counteract the addition of a 
    ### file template coming from bootcfg_esxi70.template.j2. But I can't find where it gets 
    ### added to template-file upon import
    ####
    - name: Add autoinstall-meta attributes to distros config
      command: >-
        cobbler distro edit
        --name={{ cobbler_distro.name }}
        --autoinstall-meta='tree=http://@@http_server@@/cblr/links/{{ cobbler_distro.name }} iso_file={{ cobbler_distro.artifact.file }}'
        {% if cobbler_distro.name is search("(?i)(esx|vmware)") %}
        --template-files=""
        {% endif %} 
      when: 
        - cobbler_import_result.results[cobbler_distro_index] is changed
      register: cobbler_add_ksmeta_result
      loop: "{{ _cobbler_updated_distros.values() | list }}"
      loop_control:
        loop_var: cobbler_distro
        index_var: cobbler_distro_index
        label: "{{ cobbler_distro.name }}"


    - name: Umount distros ISO files from temporary directories
      mount:
        fstype: iso9660
        opts: "loop,ro"
        path: "{{ cobbler_iso_mount_dir }}/{{ cobbler_iso_file | basename }}"
        state: absent
      register: cobbler_umount_isos_result
      loop: >-
        {{ cobbler_search_iso_files_result.files
           | map(attribute="path")
           | list
           + cobbler_distros
             | map(attribute="artifact.file")
             | list }}
      loop_control:
        loop_var: cobbler_iso_file

    ## TODO:  This seems problematic, needs more testing
    - include_tasks: clean.yml
      when:
        - artifact_result is defined
        - >-
          (artifact_result.values() | list
           + cobbler_create_mount_dirs_result.results
           + cobbler_mount_isos_result.results
           + cobbler_import_result.results
           + cobbler_add_ksmeta_result.results
           + cobbler_umount_isos_result.results)
          | select('changed')
          | list
          | length > 0
  tags:
    - role::cobbler
    - role::cobbler::configure
    - role::cobbler::configure::distros
